android.useAndroidX=true
# Global optimizations match
# Optimized for system stability (8GB RAM + heavy multitasking)
# Prevent OOM kills by limiting Gradle heap and thread usage
org.gradle.daemon=true
org.gradle.caching=true
org.gradle.parallel=false
org.gradle.configureondemand=false
org.gradle.vfs.watch=true
# Lower max heap to 1.5GB to leave room for OS/IDE
org.gradle.jvmargs=-Xmx2048m -XX:MaxMetaspaceSize=512m -XX:+UseParallelGC
# Limit workers to reduce peak memory spikes
org.gradle.workers.max=2
android.enableR8.fullMode=false

# Network resilience for CI dependency downloads
systemProp.org.gradle.internal.http.connectionTimeout=180000
systemProp.org.gradle.internal.http.socketTimeout=180000
systemProp.org.gradle.internal.repository.max.retries=10
systemProp.org.gradle.internal.repository.max.tentatives=10
