name: Build debug APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build with Gradle
        run: ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: LeanType-debug
          path: app/build/outputs/apk/**/*.apk

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        continue-on-error: true
        with:
          tag_name: v-debug
          name: LeanType Debug APK (Autocorrect Fix)
          prerelease: true
          body: |
            ### LeanType Debug APK
            - Fixed autocorrection logic for standard single-line text input fields
            - Bundled Ukrainian (`uk`) and English (`en-US`) dictionaries directly in the APK
            - Enabled auto-correction by default
          files: |
            app/build/outputs/apk/**/*.apk

      - name: Archive reports for failed job
        uses: actions/upload-artifact@v4
        with:
          name: reports
          path: '*/build/reports'
        if: ${{ failure() }}
